<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://jaidenkhosla.github.io/MinesweeperJS/assets/mine.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minesweeper</title>
    <script type="module" crossorigin src="https://jaidenkhosla.github.io/MinesweeperJS/assets/index-Ug7boq-g.js"></script>
    <link rel="stylesheet" crossorigin href="https://jaidenkhosla.github.io/MinesweeperJS/assets/index-CPbLb0XF.css">
  </head>
  <body>
    <div id="info">
      <select id="difficultySelection" >
        <option>Easy</option>
        <option selected>Medium</option>
        <option>Hard</option>
      </select>
      <div>
        <img src="./assets/flag.png"/>
        <p id="mineCount">0</p>
      </div>
      <div>
        <img src="./assets/clock_icon.png"/>
        <p id="timer">0</p>
      </div>
    </div>
    <div id="app">
      <canvas id="board"></canvas>
      <canvas id="overlay"></canvas>
      <div id="scoreboard" class="hidden">
        <span>
          <div>
            <img src="./assets/clock_icon.png"/>
            <p id="currentTime">---</p>
          </div>
          <div>
            <img src="./assets/trophy.png"/>
            <p id="bestTime">---</p>
          </div>
        </span>
        <button id="redo">
          <img src="./assets/redo.png"/>
          <p id="redopara">Try again</p>
        </button>
      </div>
    </div>
  </body>
</html>
